<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>your site</title>

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="styles.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=STIX+Two+Text:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

<div id="gate">
  <div class="gate-card">
    <img src="images/avatar.png" class="gate-avatar">
    <h1>♡ welcome ♡</h1>
    <button onclick="enterSite()">Enter Website</button>
    <p class="tiny">turning on audio + loading sweets...</p>
  </div>
</div>

<audio id="bgm" src="music/index.mp3" loop></audio>

<div id="site" class="hidden">

  <!-- SIMPLE HEADER -->
  <header class="topbar">
    ♡ your name ♡
  </header>

  <main class="layout">

    <!-- LEFT PANEL -->
    <section class="panel">
      <img src="images/avatar.png" class="avatar">

      <div class="socials">
        <a href="#">twitter</a>
        <a href="#">instagram</a>
        <a href="#">tiktok</a>
      </div>
    </section>

    <!-- MAIN CARD -->
    <section class="maincard">

      <h2>♡ welcome to my art world ♡</h2>

      <p class="desc">
        pixel-y cherry coded commission space • cute art • y2k nostalgia • kawaii vibes
      </p>

      <!-- NAV BUTTONS (NOW HERE) -->
      <div class="mainnav">
        <button onclick="location.href='index.html'">home</button>
        <button onclick="location.href='commissions.html'">commissions</button>
        <button onclick="location.href='faq.html'">faq</button>
        <button onclick="location.href='ratings.html'">ratings</button>
      </div>

      <!-- ABOUT -->
      <div class="dropdown">
        <button onclick="toggleAbout()">about me ♡</button>

        <div id="aboutBox" class="dropcontent hidden">
          <p>
            hi !! i'm your name, i draw cute things, cherries, pink chaos, and sometimes emotional stuff too ♡
          </p>
        </div>
      </div>

    </section>

  </main>
</div>

<script>
function enterSite() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("site").classList.remove("hidden");

  const music = document.getElementById("bgm");
  music.volume = 0.4;
  music.play();
}

function toggleAbout() {
  document.getElementById("aboutBox").classList.toggle("hidden");
}
</script>

</body>
</html>
