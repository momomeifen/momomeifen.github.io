<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>your site</title>

  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="stylesheet" href="styles.css"/>

  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=STIX+Two+Text:wght@400;500&display=swap" rel="stylesheet">
</head>

<body>

<!-- ENTRY GATE -->
<div id="gate">
  <div class="gate-card">
    <img src="images/avatar.png" class="gate-avatar">
    <h1>♡ welcome ♡</h1>
    <button onclick="enterSite()">Enter Website</button>
  </div>
</div>

<!-- MUSIC -->
<audio id="bgm" src="music/index.mp3" loop></audio>

<!-- SITE -->
<div id="site" class="hidden">

  <header class="topbar">
    MOMO!
  </header>

  <main class="layout">

    <div class="window">

      <!-- TITLE BAR -->
      <div class="titlebar">
        <div class="win-buttons">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="title"> momomeifen.exe </div>
      </div>

      <!-- CONTENT -->
      <div class="window-content">

        <!-- LEFT -->
        <div class="left">
          <img src="images/avatar.png" class="avatar">

          <div class="socials">
            <a href="#">bsky</a>
            <a href="#">twitter</a>
            <a href="#">tiktok</a>
            <a href="#">youtube</a>
          </div>
        </div>

        <!-- RIGHT -->
        <div class="right">

          <h2>♡ welcome to my art world ♡</h2>

          <p class="desc">
            pixel-y cherry coded commission space • cute art • y2k nostalgia • kawaii vibes
          </p>

          <div class="mainnav">
            <button onclick="location.href='commissions.html'">commissions</button>
            <button onclick="location.href='faq.html'">faq</button>
            <button onclick="location.href='ratings.html'">ratings</button>
          </div>

        </div>

      </div>

    </div>

  </main>
</div>

<script>
function enterSite() {
  document.getElementById("gate").style.display = "none";
  document.getElementById("site").classList.remove("hidden");

  const music = document.getElementById("bgm");
  music.volume = 0.4;
  music.play();
}
</script>

</body>
</html>
